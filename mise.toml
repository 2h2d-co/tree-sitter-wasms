[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tool_alias]
wasi-sdk = "github:WebAssembly/wasi-sdk"
binaryen = "github:WebAssembly/binaryen"

[tools]
hk = { version = "1.56.0", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"
node = "22.23.2"
npm = "11.19.0"
tree-sitter = "0.26.12"

[tools.wasi-sdk]
version = "wasi-sdk-33"
matching = "wasi-sdk-33.0"
strip_components = 1
bin_path = "bin"

[tools.binaryen]
version = "132"
version_prefix = "version_"
matching = "binaryen-version_132"
strip_components = 1
bin_path = "bin"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
