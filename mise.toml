[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tool_alias]
wasi-sdk = "github:WebAssembly/wasi-sdk"
binaryen = "github:WebAssembly/binaryen"

[tools]
hk = { version = "2.2.0", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
node = "22.23.3"
npm = "11.20.0"
tree-sitter = "0.27.0"

[tools.wasi-sdk]
version = "wasi-sdk-34"
matching = "wasi-sdk-34.0"
strip_components = 1
bin_path = "bin"

[tools.binaryen]
version = "133"
version_prefix = "version_"
matching = "binaryen-version_133"
strip_components = 1
bin_path = "bin"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.check]
description = "Run all non-writing project checks"
run = ["npm run check", "npm test", "npm run pack:dry"]
