name: Publish npm package

on:
  push:
    branches:
      - main
    paths:
      - sources.lock.json
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to package and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE_NAME: "@2h2d/tree-sitter-wasms"
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  build:
    name: Build npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      package-digest: ${{ steps.package.outputs.package-digest }}
      package-version: ${{ steps.package.outputs.package-version }}
    steps:
      - name: Validate requested source
        run: |
          if [[ ! $SOURCE_SHA =~ ^[0-9a-f]{40}$ || $SOURCE_SHA != "$GITHUB_SHA" ]]; then
            echo "source_sha must be the exact workflow commit" >&2
            exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify source is current main
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"

      - name: Install locked toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.2"
          install_args: --locked
          cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify generated WASMs
        run: npm run verify:generated

      - name: Pack exact package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          package_dir="$RUNNER_TEMP/npm-package"
          pack_json=$(npm run --silent pack:ci -- "$package_dir")
          archive=$(node -e '
            const value = JSON.parse(process.argv[1]);
            if (typeof value.archive !== "string") throw new Error("missing archive");
            process.stdout.write(value.archive);
          ' "$pack_json")
          digest=$(node -e '
            const value = JSON.parse(process.argv[1]);
            if (!/^[0-9a-f]{64}$/.test(value.digest)) throw new Error("invalid digest");
            process.stdout.write(value.digest);
          ' "$pack_json")
          version=$(node -e '
            const value = JSON.parse(process.argv[1]);
            if (typeof value.version !== "string") throw new Error("missing version");
            process.stdout.write(value.version);
          ' "$pack_json")
          test -f "$archive"
          printf '%s  %s\n' "$digest" "$(basename "$archive")" > "$archive.sha256"
          (
            cd "$(dirname "$archive")"
            shasum -a 256 -c "$(basename "$archive").sha256"
          )
          {
            echo "archive=$archive"
            echo "checksum=$archive.sha256"
            echo "package-digest=$digest"
            echo "package-version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Test exact package as a consumer
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm run test:package -- "$ARCHIVE"

      - name: Upload package archive
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish npm package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      attestations: write # Required to persist the package artifact attestation.
      contents: read
      id-token: write # Required for attestation signing and npm trusted publishing.
    outputs:
      package-version: ${{ steps.validate.outputs.package-version }}
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up npm publishing client
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.6.0"
          package-manager-cache: false

      - name: Verify npm publishing client
        run: |
          test "$(node --version)" = v26.6.0
          test "$(npm --version)" = 11.18.0

      - name: Download exact package archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: npm-package

      - name: Validate transferred package
        id: validate
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          EXPECTED_PACKAGE_DIGEST: ${{ needs.build.outputs.package-digest }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ARTIFACT_DIGEST"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          mapfile -t archives < <(find npm-package -maxdepth 1 -type f -name '*.tgz' -print)
          if (( ${#archives[@]} != 1 )); then
            echo "expected exactly one package archive, found ${#archives[@]}" >&2
            exit 1
          fi
          archive=$(realpath "${archives[0]}")
          checksum="$archive.sha256"
          test -f "$checksum"
          (
            cd "$(dirname "$archive")"
            shasum -a 256 -c "$(basename "$checksum")"
          )
          actual_digest=$(shasum -a 256 "$archive" | awk '{print $1}')
          test "$actual_digest" = "$EXPECTED_PACKAGE_DIGEST"

          actual_files=$(tar -tzf "$archive" | LC_ALL=C sort)
          expected_files=$(
            while IFS= read -r file; do
              test -n "$file" && printf 'package/%s\n' "$file"
            done < .github/npm-package-files |
              LC_ALL=C sort
          )
          if [[ $actual_files != "$expected_files" ]]; then
            echo "npm package contains unexpected files" >&2
            diff -u <(printf '%s\n' "$expected_files") <(printf '%s\n' "$actual_files") || true
            exit 1
          fi

          mapfile -t package_metadata < <(
            tar -xOf "$archive" package/package.json |
              EXPECTED_PACKAGE_NAME="$EXPECTED_PACKAGE_NAME" node -e '
                const chunks = [];
                process.stdin.on("data", (chunk) => chunks.push(chunk));
                process.stdin.on("end", () => {
                  const manifest = JSON.parse(Buffer.concat(chunks).toString());
                  if (
                    manifest.name !== process.env.EXPECTED_PACKAGE_NAME ||
                    typeof manifest.version !== "string"
                  ) {
                    throw new Error("unexpected package name or version");
                  }
                  const scripts =
                    manifest.scripts && typeof manifest.scripts === "object"
                      ? manifest.scripts
                      : {};
                  const forbiddenNames = [
                    "preinstall", "install", "postinstall",
                    "prepack", "prepare", "postpack",
                    "prepublish", "prepublishOnly", "publish", "postpublish",
                  ];
                  const forbidden = forbiddenNames.filter(
                    (name) => typeof scripts[name] === "string",
                  );
                  if (forbidden.length > 0) {
                    throw new Error("forbidden lifecycle scripts: " + forbidden.join(", "));
                  }
                  const bundled =
                    manifest.bundledDependencies ?? manifest.bundleDependencies;
                  if (
                    bundled === true ||
                    (Array.isArray(bundled) && bundled.length > 0)
                  ) {
                    throw new Error("bundled dependencies are forbidden");
                  }
                  if (manifest.dependencies || manifest.optionalDependencies) {
                    throw new Error("consumer dependencies are forbidden");
                  }
                  console.log(manifest.name);
                  console.log(manifest.version);
                });
              '
          )
          if (( ${#package_metadata[@]} != 2 )); then
            echo "could not read package identity" >&2
            exit 1
          fi
          package_name=${package_metadata[0]}
          package_version=${package_metadata[1]}
          test "$package_version" = "$EXPECTED_PACKAGE_VERSION"
          {
            echo "archive=$archive"
            echo "checksum=$checksum"
            echo "package_name=$package_name"
            echo "package_version=$package_version"
          } >> "$GITHUB_ENV"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Attest package archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.archive }}
            ${{ env.checksum }}

      - name: Publish or verify existing npm package
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/npm-version.json"
          code=$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --silent \
            --show-error \
            --output "$metadata" \
            --write-out '%{http_code}' \
            "https://registry.npmjs.org/@2h2d%2ftree-sitter-wasms/$package_version")
          if [[ $code == 200 ]]; then
            tarball=$(node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (
                typeof value?.dist?.tarball !== "string" ||
                !value.dist.tarball.startsWith(
                  "https://registry.npmjs.org/@2h2d/tree-sitter-wasms/-/",
                )
              ) {
                throw new Error("registry returned an unexpected tarball URL");
              }
              process.stdout.write(value.dist.tarball);
            ' "$metadata")
            public_archive="$RUNNER_TEMP/public-package.tgz"
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --location \
              --silent \
              --show-error \
              --output "$public_archive" \
              "$tarball"
            public_digest=$(shasum -a 256 "$public_archive" | awk '{print $1}')
            local_digest=$(shasum -a 256 "$archive" | awk '{print $1}')
            if [[ $public_digest != "$local_digest" ]]; then
              echo "public npm archive does not match current package artifact" >&2
              exit 1
            fi
            echo "npm already contains the identical package version"
          elif [[ $code == 404 ]]; then
            npm publish "$archive" \
              --access public \
              --ignore-scripts \
              --provenance
          else
            echo "npm registry metadata request failed with HTTP $code" >&2
            exit 1
          fi

  integration:
    name: Test public npm package
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Install locked toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.2"
          install_args: --locked
          cache: false

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Download and verify public npm archive
        env:
          PACKAGE_DIGEST: ${{ needs.build.outputs.package-digest }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package-version }}
        run: |
          npm run verify:published -- \
            "$EXPECTED_PACKAGE_NAME" \
            "$PACKAGE_VERSION" \
            "$PACKAGE_DIGEST" \
            "$RUNNER_TEMP/public-package.tgz"

      - name: Test public package as a consumer
        run: npm run test:package -- "$RUNNER_TEMP/public-package.tgz"

  finalize:
    name: Create GitHub release
    needs:
      - build
      - integration
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create the lightweight tag and GitHub release.
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Download exact package archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: npm-package

      - name: Create lightweight tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIGEST: ${{ needs.build.outputs.package-digest }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package-version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          archive=$(find npm-package -maxdepth 1 -type f -name '*.tgz' -print)
          test -f "$archive"
          test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$PACKAGE_DIGEST"
          test -f "$archive.sha256"
          tag="v$PACKAGE_VERSION"

          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null); then
            existing_sha=$(jq -r .object.sha <<< "$existing")
            existing_type=$(jq -r .object.type <<< "$existing")
            if [[ $existing_type != commit || $existing_sha != "$SOURCE_SHA" ]]; then
              echo "existing tag $tag does not point directly to $SOURCE_SHA" >&2
              exit 1
            fi
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$SOURCE_SHA"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" \
              "$archive" \
              "$archive.sha256" \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
